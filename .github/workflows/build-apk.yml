import os
import sqlite3
from datetime import datetime
from pathlib import Path
from typing import Optional

from dotenv import load_dotenv
from fastapi import FastAPI, HTTPException
from fastapi.responses import FileResponse
from fastapi.middleware.cors import CORSMiddleware
from openai import OpenAI
from pydantic import BaseModel

load_dotenv()

APP_NAME = "FRIDAY AI"
DATABASE = "friday.db"
MODEL = os.getenv("OPENAI_MODEL", "gpt-4.1-mini")
API_KEY = os.getenv("OPENAI_API_KEY")

client = OpenAI(api_key=API_KEY) if API_KEY else None

app = FastAPI(title=APP_NAME)

app.add_middleware(
    CORSMiddleware,
    allow_origins=["*"],
    allow_credentials=True,
    allow_methods=["*"],
    allow_headers=["*"],
)


def now():
    return datetime.now().isoformat(timespec="seconds")


def get_db():
    connection = sqlite3.connect(DATABASE)
    connection.row_factory = sqlite3.Row
    return connection


def init_database():
    db = get_db()

    db.executescript(
        """
        CREATE TABLE IF NOT EXISTS messages (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            user_id TEXT NOT NULL,
            role TEXT NOT NULL,
            content TEXT NOT NULL,
            created_at TEXT NOT NULL
        );

        CREATE TABLE IF NOT EXISTS notes (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            user_id TEXT NOT NULL,
            title TEXT NOT NULL,
            content TEXT NOT NULL,
            folder TEXT DEFAULT 'General',
            created_at TEXT NOT NULL
        );

        CREATE TABLE IF NOT EXISTS tasks (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            user_id TEXT NOT NULL,
            title TEXT NOT NULL,
            due_date TEXT,
            status TEXT DEFAULT 'pending',
            created_at TEXT NOT NULL
        );

        CREATE TABLE IF NOT EXISTS memories (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            user_id TEXT NOT NULL,
            memory_key TEXT NOT NULL,
            memory_value TEXT NOT NULL,
            created_at TEXT NOT NULL
        );
        """
    )

    db.commit()
    db.close()


init_database()


class ChatRequest(BaseModel):
    user_id: str = "default_user"
    message: str


class NoteRequest(BaseModel):
    user_id: str = "default_user"
    title: str
    content: str
    folder: str = "General"


class TaskRequest(BaseModel):
    user_id: str = "default_user"
    title: str
    due_date: Optional[str] = None


class MemoryRequest(BaseModel):
    user_id: str = "default_user"
    key: str
    value: str


def detect_mode(message: str) -> str:
    text = message.lower()

    if any(word in text for word in [
        "english", "grammar", "sentence", "speaking",
        "correct my english", "translate"
    ]):
        return "english"

    if any(word in text for word in [
        "trading", "stock", "share", "investment",
        "finance", "paisa", "profit", "loss"
    ]):
        return "finance"

    if any(word in text for word in [
        "python", "coding", "programming", "ai sikho",
        "learn ai", "learning", "study", "padhai"
    ]):
        return "learning"

    if any(word in text for word in [
        "note", "save this", "likh lo", "yaad rakhna"
    ]):
        return "notes"

    if any(word in text for word in [
        "task", "reminder", "remind", "yaad dilana",
        "aaj ka plan", "tomorrow plan"
    ]):
        return "tasks"

    return "general"


def get_recent_messages(user_id: str, limit: int = 12):
    db = get_db()

    rows = db.execute(
        """
        SELECT role, content
        FROM messages
        WHERE user_id = ?
        ORDER BY id DESC
        LIMIT ?
        """,
        (user_id, limit),
    ).fetchall()

    db.close()

    return list(reversed(rows))


def get_memories(user_id: str):
    db = get_db()

    rows = db.execute(
        """
        SELECT memory_key, memory_value
        FROM memories
        WHERE user_id = ?
        ORDER BY id DESC
        LIMIT 30
        """,
        (user_id,),
    ).fetchall()

    db.close()
    return rows


def save_message(user_id: str, role: str, content: str):
    db = get_db()

    db.execute(
        """
        INSERT INTO messages
        (user_id, role, content, created_at)
        VALUES (?, ?, ?, ?)
        """,
        (user_id, role, content, now()),
    )

    db.commit()
    db.close()


def build_system_prompt(mode: str, memories) -> str:
    memory_text = "
".join(
        f"- {item['memory_key']}: {item['memory_value']}"
        for item in memories
    )

    return f"""
You are FRIDAY, a personal AI assistant.

User preference:
- Default language: Hinglish
- User level: Beginner
- Style: Practical, simple and step-by-step
- Current mode: {mode}

Important behavior:
1. Explain difficult topics in simple language.
2. Use Hindi-English mix unless the user asks for pure English.
3. Help with AI, coding, English, productivity and learning.
4. For finance and trading, provide education only.
5. Never promise guaranteed profit.
6. Never pretend that an action was completed if it was not.
7. Ask for missing information when required.
8. Before sending, deleting, buying or changing something external, ask for confirmation.
9. Do not expose API keys or private data.
10. Give concise but useful answers.

Known user memories:
{memory_text if memory_text else "No saved memories yet."}
"""


def fallback_response(message: str, mode: str) -> str:
    if mode == "learning":
        return (
            "Learning mode active hai.

"
            "Aaj ka simple plan:
"
            "1. Topic ka basic concept samjho.
"
            "2. Ek practical example dekho.
"
            "3. Khud ek small exercise karo.
"
            "4. Mujhe apna answer bhejo, main check karunga."
        )

    if mode == "english":
        return (
            "English Coach mode active hai. "
            "Apna English sentence bhejo. Main correction, better sentence "
            "aur short explanation dunga."
        )

    if mode == "finance":
        return (
            "Finance learning mode active hai. Main risk, budgeting, "
            "investing aur trading concepts samjha sakta hoon. "
            "Guaranteed profit ya blind buy/sell signal nahi dunga."
        )

    if mode == "tasks":
        return (
            "Task banane ke liye mujhe task ka naam aur date/time batao. "
            "Example: 'Kal subah Python practice yaad dilana.'"
        )

    if mode == "notes":
        return (
            "Note save karne ke liye title aur content bhejo. "
            "Example: 'AI Idea naam se note save karo: voice assistant banana hai.'"
        )

    return (
        "Namaste! Main FRIDAY hoon.

"
        "Main tumhari AI learning, coding, English, notes, tasks "
        "aur finance education mein help kar sakta hoon."
    )


def generate_ai_response(
    user_id: str,
    message: str,
    mode: str,
) -> str:
    memories = get_memories(user_id)
    recent = get_recent_messages(user_id)

    if client is None:
        return fallback_response(message, mode)

    system_prompt = build_system_prompt(mode, memories)

    conversation = [
        {
            "role": "system",
            "content": system_prompt,
        }
    ]

    for item in recent:
        conversation.append(
            {
                "role": item["role"],
                "content": item["content"],
            }
        )

    conversation.append(
        {
            "role": "user",
            "content": message,
        }
    )

    try:
        result = client.chat.completions.create(
            model=MODEL,
            messages=conversation,
            temperature=0.6,
        )

        return result.choices[0].message.content.strip()

    except Exception:
        return (
            "AI service abhi available nahi hai. "
            "API key, model name aur internet connection check karo."
        )


@app.get("/")
def root():
    return {
        "app": APP_NAME,
        "status": "online",
        "message": "FRIDAY backend is running",
    }


@app.get("/health")
def health():
    return {
        "status": "healthy",
        "ai_configured": bool(API_KEY),
    }


@app.get("/app")
def frontend():
    file_path = Path("static/index.html")

    if not file_path.exists():
        raise HTTPException(
            status_code=404,
            detail="Frontend file not found",
        )

    return FileResponse(file_path)


@app.post("/chat")
def chat(request: ChatRequest):
    message = request.message.strip()

    if not message:
        raise HTTPException(
            status_code=400,
            detail="Message cannot be empty",
        )

    mode = detect_mode(message)

    save_message(
        request.user_id,
        "user",
        message,
    )

    response = generate_ai_response(
        request.user_id,
        message,
        mode,
    )

    save_message(
        request.user_id,
        "assistant",
        response,
    )

    return {
        "assistant": APP_NAME,
        "mode": mode,
        "response": response,
    }


@app.post("/notes")
def create_note(request: NoteRequest):
    if not request.title.strip() or not request.content.strip():
        raise HTTPException(
            status_code=400,
            detail="Title and content are required",
        )

    db = get_db()

    cursor = db.execute(
        """
        INSERT INTO notes
        (user_id, title, content, folder, created_at)
        VALUES (?, ?, ?, ?, ?)
        """,
        (
            request.user_id,
            request.title.strip(),
            request.content.strip(),
            request.folder.strip(),
            now(),
        ),
    )

    db.commit()
    note_id = cursor.lastrowid
    db.close()

    return {
        "success": True,
        "note_id": note_id,
        "message": "Note save ho gaya.",
    }


@app.get("/notes/{user_id}")
def list_notes(user_id: str):
    db = get_db()

    rows = db.execute(
        """
        SELECT *
        FROM notes
        WHERE user_id = ?
        ORDER BY id DESC
        """,
        (user_id,),
    ).fetchall()

    db.close()

    return [dict(row) for row in rows]


@app.delete("/notes/{note_id}")
def delete_note(note_id: int):
    db = get_db()

    cursor = db.execute(
        "DELETE FROM notes WHERE id = ?",
        (note_id,),
    )

    db.commit()
    deleted = cursor.rowcount
    db.close()

    if deleted == 0:
        raise HTTPException(
            status_code=404,
            detail="Note not found",
        )

    return {
        "success": True,
        "message": "Note delete ho gaya.",
    }


@app.post("/tasks")
def create_task(request: TaskRequest):
    if not request.title.strip():
        raise HTTPException(
            status_code=400,
            detail="Task title is required",
        )

    db = get_db()

    cursor = db.execute(
        """
        INSERT INTO tasks
        (user_id, title, due_date, status, created_at)
        VALUES (?, ?, ?, ?, ?)
        """,
        (
            request.user_id,
            request.title.strip(),
            request.due_date,
            "pending",
            now(),
        ),
    )

    db.commit()
    task_id = cursor.lastrowid
    db.close()

    return {
        "success": True,
        "task_id": task_id,
        "message": "Task create ho gaya.",
    }


@app.get("/tasks/{user_id}")
def list_tasks(user_id: str):
    db = get_db()

    rows = db.execute(
        """
        SELECT *
        FROM tasks
        WHERE user_id = ?
        ORDER BY id DESC
        """,
        (user_id,),
    ).fetchall()

    db.close()

    return [dict(row) for row in rows]


@app.patch("/tasks/{task_id}/complete")
def complete_task(task_id: int):
    db = get_db()

    cursor = db.execute(
        """
        UPDATE tasks
        SET status = 'completed'
        WHERE id = ?
        """,
        (task_id,),
    )

    db.commit()
    updated = cursor.rowcount
    db.close()

    if updated == 0:
        raise HTTPException(
            status_code=404,
            detail="Task not found",
        )

    return {
        "success": True,
        "message": "Task complete mark ho gaya.",
    }


