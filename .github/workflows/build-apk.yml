name: Build FRIDAY V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Create FRIDAY project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/friday

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FRIDAY_V2"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.example.friday"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.friday"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 3
                  versionName = "2.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>

              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="FRIDAY"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".FridayVoiceService"
                      android:foregroundServiceType="microphone"
                      android:exported="false"/>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/example/friday/MainActivity.java <<'EOF'
          package com.example.friday;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.speech.RecognizerIntent;
          import android.speech.tts.TextToSpeech;
          import android.view.Gravity;
          import android.widget.*;

          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private TextToSpeech tts;
              private TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (android.os.Build.VERSION.SDK_INT >= 23 &&
                      checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                      != PackageManager.PERMISSION_GRANTED) {

                      requestPermissions(
                          new String[]{Manifest.permission.RECORD_AUDIO},
                          10
                      );
                  }

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setPadding(32, 32, 32, 32);

                  TextView title = new TextView(this);
                  title.setText("FRIDAY");
                  title.setTextSize(36);
                  title.setGravity(Gravity.CENTER);

                  TextView core = new TextView(this);
                  core.setText("◉\n\nAI CORE");
                  core.setTextSize(25);
                  core.setGravity(Gravity.CENTER);

                  status = new TextView(this);
                  status.setText("SYSTEM READY");
                  status.setTextSize(18);
                  status.setGravity(Gravity.CENTER);
                  status.setPadding(0, 25, 0, 25);

                  Button speak = new Button(this);
                  speak.setText("🎙️ SPEAK TO FRIDAY");

                  Button activate = new Button(this);
                  activate.setText("ACTIVATE VOICE SERVICE");

                  root.addView(title);
                  root.addView(core);
                  root.addView(status);
                  root.addView(speak);
                  root.addView(activate);

                  setContentView(root);

                  tts = new TextToSpeech(this, result -> {
                      if (result == TextToSpeech.SUCCESS) {
                          tts.setLanguage(Locale.getDefault());
                      }
                  });

                  speak.setOnClickListener(v -> listen());

                  activate.setOnClickListener(v -> {

                      Intent service =
                          new Intent(this, FridayVoiceService.class);

                      if (android.os.Build.VERSION.SDK_INT >= 26) {
                          startForegroundService(service);
                      } else {
                          startService(service);
                      }

                      status.setText("VOICE SERVICE • ACTIVE");

                      say("Yes, I'm listening.");
                  });
              }

              private void listen() {

                  Intent intent =
                      new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);

                  intent.putExtra(
                      RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                      RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                  );

                  intent.putExtra(
                      RecognizerIntent.EXTRA_LANGUAGE,
                      "hi-IN"
                  );

                  startActivityForResult(intent, 100);
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );

                  if (requestCode == 100 &&
                      resultCode == RESULT_OK &&
                      data != null) {

                      ArrayList<String> results =
                          data.getStringArrayListExtra(
                              RecognizerIntent.EXTRA_RESULTS
                          );

                      if (results != null &&
                          !results.isEmpty()) {

                          handleCommand(results.get(0));
                      }
                  }
              }

              private void handleCommand(String command) {

                  String q =
                      command.toLowerCase(Locale.ROOT);

                  status.setText(
                      "COMMAND:\n" + command
                  );

                  if (q.contains("youtube")) {

                      say("Opening YouTube.");

                      Intent app =
                          getPackageManager()
                          .getLaunchIntentForPackage(
                              "com.google.android.youtube"
                          );

                      if (app != null) {
                          startActivity(app);
                      }

                  } else if (
                      q.contains("calculator") ||
                      q.contains("कैलकुलेटर")) {

                      say("Opening calculator.");

                      Intent calculator =
                          new Intent(
                              "android.intent.action.MAIN"
                          );

                      calculator.addCategory(
                          "android.intent.category.APP_CALCULATOR"
                      );

                      try {
                          startActivity(calculator);
                      } catch (Exception ignored) {}

                  } else if (
                      q.contains("hello") ||
                      q.contains("hi") ||
                      q.contains("हेलो")) {

                      say("Hello. FRIDAY is ready.");

                  } else {

                      say(
                          "I heard you. " +
                          "Advanced FRIDAY controls will be added."
                      );
                  }
              }

              private void say(String text) {

                  if (tts != null) {

                      tts.speak(
                          text,
                          TextToSpeech.QUEUE_FLUSH,
                          null,
                          "friday"
                      );
                  }
              }

              @Override
              protected void onDestroy() {

                  if (tts != null) {
                      tts.shutdown();
                  }

                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/java/com/example/friday/FridayVoiceService.java <<'EOF'
          package com.example.friday;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;

          public class FridayVoiceService extends Service {

              private static final String CHANNEL =
                  "friday_voice";

              @Override
              public void onCreate() {

                  super.onCreate();

                  if (Build.VERSION.SDK_INT >= 26) {

                      NotificationChannel channel =
                          new NotificationChannel(
                              CHANNEL,
                              "FRIDAY Voice",
                              NotificationManager.IMPORTANCE_LOW
                          );

                      getSystemService(
                          NotificationManager.class
                      ).createNotificationChannel(channel);
                  }

                  Notification.Builder builder;

                  if (Build.VERSION.SDK_INT >= 26) {

                      builder =
                          new Notification.Builder(
                              this,
                              CHANNEL
                          );

                  } else {

                      builder =
                          new Notification.Builder(this);
                  }

                  builder
                      .setContentTitle("FRIDAY")
                      .setContentText(
                          "FRIDAY voice service is active"
                      )
                      .setSmallIcon(
                          android.R.drawable.ic_btn_speak_now
                      );

                  startForeground(
                      77,
                      builder.build()
                  );
              }

              @Override
              public int onStartCommand(
                      Intent intent,
                      int flags,
                      int startId) {

                  return START_STICKY;
              }

              @Override
              public IBinder onBind(Intent intent) {

                  return null;
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-v2-apk
          path: app/build/outputs/apk/debug/app-debug.apk
