name: Build FRIDAY V3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Create FRIDAY V3 project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/friday
          mkdir -p app/src/main/res/xml

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FRIDAY_V3"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.example.friday"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.friday"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 5
                  versionName = "3.0"
              }
          }
          EOF

          cat > app/src/main/res/xml/friday_accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_description"
              android:notificationTimeout="100"
              android:settingsActivity="com.example.friday.MainActivity" />
          EOF

          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">FRIDAY</string>
              <string name="accessibility_description">FRIDAY uses Android Accessibility features for user-approved automation.</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>

              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="@string/app_name"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".FridayVoiceService"
                      android:foregroundServiceType="microphone"
                      android:exported="false"/>

                  <service
                      android:name=".FridayAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/friday_accessibility_config"/>

                  </service>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/example/friday/MainActivity.java <<'EOF'
          package com.example.friday;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.speech.RecognizerIntent;
          import android.speech.tts.TextToSpeech;
          import android.view.Gravity;
          import android.widget.*;

          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private TextToSpeech tts;
              private TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (android.os.Build.VERSION.SDK_INT >= 23 &&
                      checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                      != PackageManager.PERMISSION_GRANTED) {

                      requestPermissions(
                          new String[]{Manifest.permission.RECORD_AUDIO},
                          10
                      );
                  }

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setPadding(32, 32, 32, 32);

                  TextView title = new TextView(this);
                  title.setText("FRIDAY V3");
                  title.setTextSize(36);
                  title.setGravity(Gravity.CENTER);

                  TextView core = new TextView(this);
                  core.setText("◉\n\nAI CORE\n\nVOICE + AUTOMATION");
                  core.setTextSize(22);
                  core.setGravity(Gravity.CENTER);

                  status = new TextView(this);
                  status.setText("SYSTEM READY");
                  status.setTextSize(18);
                  status.setGravity(Gravity.CENTER);
                  status.setPadding(0, 20, 0, 20);

                  Button speak = new Button(this);
                  speak.setText("🎙️ SPEAK TO FRIDAY");

                  Button service = new Button(this);
                  service.setText("ACTIVATE VOICE SERVICE");

                  Button accessibility = new Button(this);
                  accessibility.setText("ENABLE AUTOMATION");

                  root.addView(title);
                  root.addView(core);
                  root.addView(status);
                  root.addView(speak);
                  root.addView(service);
                  root.addView(accessibility);

                  setContentView(root);

                  tts = new TextToSpeech(this, result -> {
                      if (result == TextToSpeech.SUCCESS) {
                          tts.setLanguage(new Locale("hi", "IN"));
                      }
                  });

                  speak.setOnClickListener(v -> listen());

                  service.setOnClickListener(v -> {

                      Intent intent =
                          new Intent(this, FridayVoiceService.class);

                      if (android.os.Build.VERSION.SDK_INT >= 26) {
                          startForegroundService(intent);
                      } else {
                          startService(intent);
                      }

                      status.setText("VOICE SERVICE • ACTIVE");
                      say("FRIDAY voice service is active.");
                  });

                  accessibility.setOnClickListener(v -> {

                      try {
                          startActivity(
                              new Intent(
                                  Settings.ACTION_ACCESSIBILITY_SETTINGS
                              )
                          );

                          say("Please enable FRIDAY accessibility service.");

                      } catch (Exception e) {
                          say("Accessibility settings could not be opened.");
                      }
                  });
              }

              private void listen() {

                  Intent intent =
                      new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);

                  intent.putExtra(
                      RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                      RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                  );

                  intent.putExtra(
                      RecognizerIntent.EXTRA_LANGUAGE,
                      "hi-IN"
                  );

                  startActivityForResult(intent, 100);
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );

                  if (requestCode == 100 &&
                      resultCode == RESULT_OK &&
                      data != null) {

                      ArrayList<String> results =
                          data.getStringArrayListExtra(
                              RecognizerIntent.EXTRA_RESULTS
                          );

                      if (results != null &&
                          !results.isEmpty()) {

                          handleCommand(results.get(0));
                      }
                  }
              }

              private void handleCommand(String command) {

                  String q =
                      command.toLowerCase(Locale.ROOT).trim();

                  status.setText("COMMAND:\n" + command);

                  // YouTube + search
                  if ((q.contains("youtube") ||
                       q.contains("यूट्यूब") ||
                       q.contains("यूटुब")) &&
                      (q.contains("search") ||
                       q.contains("सर्च") ||
                       q.contains("खोज") ||
                       q.contains("ढूंढ"))) {

                      String query = extractSearchQuery(q);

                      if (query.isEmpty()) {
                          say("What should I search on YouTube?");
                          return;
                      }

                      say("Searching YouTube.");

                      Intent search =
                          new Intent(
                              Intent.ACTION_VIEW,
                              Uri.parse(
                                  "https://www.youtube.com/results?search_query="
                                  + Uri.encode(query)
                              )
                          );

                      startActivity(search);

                  // Open YouTube
                  } else if (
                      q.contains("youtube") ||
                      q.contains("यूट्यूब") ||
                      q.contains("यूटुब")) {

                      say("Opening YouTube.");

                      Intent app =
                          getPackageManager()
                          .getLaunchIntentForPackage(
                              "com.google.android.youtube"
                          );

                      if (app != null) {
                          startActivity(app);
                      } else {
                          startActivity(
                              new Intent(
                                  Intent.ACTION_VIEW,
                                  Uri.parse("https://www.youtube.com")
                              )
                          );
                      }

                  // Calculator
                  } else if (
                      q.contains("calculator") ||
                      q.contains("कैलकुलेटर") ||
                      q.contains("calculate")) {

                      say("Opening calculator.");

                      Intent calculator =
                          new Intent("android.intent.action.MAIN");

                      calculator.addCategory(
                          "android.intent.category.APP_CALCULATOR"
                      );

                      try {
                          startActivity(calculator);
                      } catch (Exception e) {
                          say("Calculator app was not found.");
                      }

                  // Browser/search
                  } else if (
                      q.contains("browser kholo") ||
                      q.contains("browser खोलो") ||
                      q.contains("google kholo") ||
                      q.contains("गूगल खोलो")) {

                      say("Opening browser.");

                      startActivity(
                          new Intent(
                              Intent.ACTION_VIEW,
                              Uri.parse("https://www.google.com")
                          )
                      );

                  // Greetings
                  } else if (
                      q.contains("hello") ||
                      q.contains("hi") ||
                      q.contains("hey") ||
                      q.contains("हेलो") ||
                      q.contains("हाय") ||
                      q.contains("नमस्ते")) {

                      say("Hello. FRIDAY is ready.");

                  // Identity
                  } else if (
                      q.contains("who are you") ||
                      q.contains("tum kon ho") ||
                      q.contains("तुम कौन हो")) {

                      say("I am FRIDAY, your personal AI assistant.");

                  } else {

                      say(
                          "Command received. " +
                          "FRIDAY is ready for more automation."
                      );
                  }
              }

              private String extractSearchQuery(String q) {

                  String[] markers = {
                      "search",
                      "सर्च",
                      "खोज",
                      "ढूंढ"
                  };

                  for (String marker : markers) {

                      int index = q.indexOf(marker);

                      if (index >= 0) {

                          String result =
                              q.substring(index + marker.length())
                               .trim();

                          result = result
                              .replace("on youtube", "")
                              .replace("youtube par", "")
                              .replace("youtube pe", "")
                              .replace("यूट्यूब पर", "")
                              .replace("यूट्यूब पे", "")
                              .trim();

                          return result;
                      }
                  }

                  return "";
              }

              private void say(String text) {

                  if (tts != null) {
                      tts.speak(
                          text,
                          TextToSpeech.QUEUE_FLUSH,
                          null,
                          "friday"
                      );
                  }
              }

              @Override
              protected void onDestroy() {

                  if (tts != null) {
                      tts.shutdown();
                  }

                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/java/com/example/friday/FridayVoiceService.java <<'EOF'
          package com.example.friday;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;

          public class FridayVoiceService extends Service {

              private static final String CHANNEL = "friday_voice";

              @Override
              public void onCreate() {

                  super.onCreate();

                  if (Build.VERSION.SDK_INT >= 26) {

                      NotificationChannel channel =
                          new NotificationChannel(
                              CHANNEL,
                              "FRIDAY Voice",
                              NotificationManager.IMPORTANCE_LOW
                          );

                      getSystemService(
                          NotificationManager.class
                      ).createNotificationChannel(channel);
                  }

                  Notification.Builder builder;

                  if (Build.VERSION.SDK_INT >= 26) {
                      builder =
                          new Notification.Builder(this, CHANNEL);
                  } else {
                      builder =
                          new Notification.Builder(this);
                  }

                  builder
                      .setContentTitle("FRIDAY")
                      .setContentText(
                          "FRIDAY voice service is active"
                      )
                      .setSmallIcon(
                          android.R.drawable.ic_btn_speak_now
                      );

                  startForeground(77, builder.build());
              }

              @Override
              public int onStartCommand(
                      Intent intent,
                      int flags,
                      int startId) {

                  return START_STICKY;
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          cat > app/src/main/java/com/example/friday/FridayAccessibilityService.java <<'EOF'
          package com.example.friday;

          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;

          public class FridayAccessibilityService
                  extends AccessibilityService {

              @Override
              public void onAccessibilityEvent(
                      AccessibilityEvent event) {
                  // Foundation for user-approved UI automation.
              }

              @Override
              public void onInterrupt() {
                  // Accessibility interruption.
              }

              public boolean pressBack() {
                  return performGlobalAction(
                      GLOBAL_ACTION_BACK
                  );
              }

              public boolean pressHome() {
                  return performGlobalAction(
                      GLOBAL_ACTION_HOME
                  );
              }

              public boolean openRecentApps() {
                  return performGlobalAction(
                      GLOBAL_ACTION_RECENTS
                  );
              }

              public AccessibilityNodeInfo getCurrentRoot() {
                  return getRootInActiveWindow();
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-V3-apk
          path: app/build/outputs/apk/debug/app-debug.apk
