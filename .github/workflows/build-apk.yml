name: Build FRIDAY V3 Fixed

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Create project folders
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/friday
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

      - name: Create settings.gradle.kts
        shell: bash
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FRIDAY"
          include(":app")
          EOF

      - name: Create root build.gradle.kts
        shell: bash
        run: |
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

      - name: Create app build.gradle.kts
        shell: bash
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.example.friday"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.friday"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 6
                  versionName = "3.1"
              }
          }
          EOF

      - name: Create strings.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">FRIDAY</string>
              <string name="accessibility_description">FRIDAY user-approved automation service.</string>
          </resources>
          EOF

      - name: Create accessibility config
        shell: bash
        run: |
          cat > app/src/main/res/xml/friday_accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_description"
              android:notificationTimeout="100" />
          EOF

      - name: Create AndroidManifest.xml
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="@string/app_name"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".FridayVoiceService"
                      android:foregroundServiceType="microphone"
                      android:exported="false"/>

                  <service
                      android:name=".FridayAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/friday_accessibility_config"/>

                  </service>

              </application>

          </manifest>
          EOF

      - name: Create MainActivity.java
        shell: bash
        run: |
          cat > app/src/main/java/com/example/friday/MainActivity.java <<'EOF'
          package com.example.friday;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.speech.RecognizerIntent;
          import android.speech.tts.TextToSpeech;
          import android.view.Gravity;
          import android.widget.*;

          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private TextToSpeech tts;
              private TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (android.os.Build.VERSION.SDK_INT >= 23 &&
                      checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                      != PackageManager.PERMISSION_GRANTED) {

                      requestPermissions(
                          new String[]{Manifest.permission.RECORD_AUDIO},
                          10
                      );
                  }

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setPadding(32, 32, 32, 32);

                  TextView title = new TextView(this);
                  title.setText("FRIDAY");
                  title.setTextSize(38);
                  title.setGravity(Gravity.CENTER);

                  TextView version = new TextView(this);
                  version.setText("V3.1 • AI ASSISTANT");
                  version.setTextSize(18);
                  version.setGravity(Gravity.CENTER);

                  TextView core = new TextView(this);
                  core.setText("◉\n\nAI CORE\n\nVOICE + AUTOMATION");
                  core.setTextSize(22);
                  core.setGravity(Gravity.CENTER);

                  status = new TextView(this);
                  status.setText("SYSTEM READY");
                  status.setTextSize(18);
                  status.setGravity(Gravity.CENTER);
                  status.setPadding(0, 20, 0, 20);

                  Button speak = new Button(this);
                  speak.setText("🎙 SPEAK TO FRIDAY");

                  Button service = new Button(this);
                  service.setText("ACTIVATE VOICE SERVICE");

                  Button accessibility = new Button(this);
                  accessibility.setText("ENABLE AUTOMATION");

                  root.addView(title);
                  root.addView(version);
                  root.addView(core);
                  root.addView(status);
                  root.addView(speak);
                  root.addView(service);
                  root.addView(accessibility);

                  setContentView(root);

                  tts = new TextToSpeech(this, result -> {
                      if (result == TextToSpeech.SUCCESS) {
                          tts.setLanguage(new Locale("hi", "IN"));
                      }
                  });

                  speak.setOnClickListener(v -> listen());

                  service.setOnClickListener(v -> {

                      Intent intent =
                          new Intent(this, FridayVoiceService.class);

                      if (android.os.Build.VERSION.SDK_INT >= 26) {
                          startForegroundService(intent);
                      } else {
                          startService(intent);
                      }

                      status.setText("VOICE SERVICE ACTIVE");
                      say("FRIDAY voice service is active.");
                  });

                  accessibility.setOnClickListener(v -> {

                      try {
                          startActivity(
                              new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                          );

                          say("Please enable FRIDAY automation service.");

                      } catch (Exception e) {
                          say("Accessibility settings could not be opened.");
                      }
                  });
              }

              private void listen() {

                  Intent intent =
                      new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);

                  intent.putExtra(
                      RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                      RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                  );

                  intent.putExtra(
                      RecognizerIntent.EXTRA_LANGUAGE,
                      "hi-IN"
                  );

                  startActivityForResult(intent, 100);
              }

              @Override
              protected void onActivityResult(
                  int requestCode,
                  int resultCode,
                  Intent data) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );

                  if (requestCode == 100 &&
                      resultCode == RESULT_OK &&
                      data != null) {

                      ArrayList<String> results =
                          data.getStringArrayListExtra(
                              RecognizerIntent.EXTRA_RESULTS
                          );

                      if (results != null && !results.isEmpty()) {
                          handleCommand(results.get(0));
                      }
                  }
              }

              private void handleCommand(String command) {

                  String q =
                      command.toLowerCase(Locale.ROOT).trim();

                  status.setText(
                      "COMMAND RECEIVED:\n" + command
                  );

                  if (q.contains("youtube") ||
                      q.contains("यूट्यूब") ||
                      q.contains("यूटुब")) {

                      say("Opening YouTube.");

                      Intent app =
                          getPackageManager()
                          .getLaunchIntentForPackage(
                              "com.google.android.youtube"
                          );

                      if (app != null) {
                          startActivity(app);
                      } else {
                          startActivity(
                              new Intent(
                                  Intent.ACTION_VIEW,
                                  Uri.parse(
                                      "https://www.youtube.com"
                                  )
                              )
                          );
                      }

                  } else if (
                      q.contains("calculator") ||
                      q.contains("कैलकुलेटर") ||
                      q.contains("calculate")) {

                      say("Opening calculator.");

                      Intent calculator =
                          new Intent(
                              "android.intent.action.MAIN"
                          );

                      calculator.addCategory(
                          "android.intent.category.APP_CALCULATOR"
                      );

                      try {
                          startActivity(calculator);
                      } catch (Exception e) {
                          say("Calculator was not found.");
                      }

                  } else if (
                      q.contains("browser") ||
                      q.contains("google") ||
                      q.contains("ब्राउज़र") ||
                      q.contains("गूगल")) {

                      say("Opening browser.");

                      startActivity(
                          new Intent(
                              Intent.ACTION_VIEW,
                              Uri.parse(
                                  "https://www.google.com"
                              )
                          )
                      );

                  } else if (
                      q.contains("hello") ||
                      q.contains("hi") ||
                      q.contains("hey") ||
                      q.contains("हेलो") ||
                      q.contains("हाय") ||
                      q.contains("नमस्ते")) {

                      say(
                          "Hello. FRIDAY is ready."
                      );

                  } else if (
                      q.contains("who are you") ||
                      q.contains("tum kon ho") ||
                      q.contains("तुम कौन हो")) {

                      say(
                          "I am FRIDAY, your personal AI assistant."
                      );

                  } else {

                      say(
                          "Command received. FRIDAY is ready."
                      );
                  }
              }

              private void say(String text) {

                  if (tts != null) {
                      tts.speak(
                          text,
                          TextToSpeech.QUEUE_FLUSH,
                          null,
                          "friday"
                      );
                  }
              }

              @Override
              protected void onDestroy() {

                  if (tts != null) {
                      tts.shutdown();
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Create FridayVoiceService.java
        shell: bash
        run: |
          cat > app/src/main/java/com/example/friday/FridayVoiceService.java <<'EOF'
          package com.example.friday;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;

          public class FridayVoiceService extends Service {

              private static final String CHANNEL =
                  "friday_voice";

              @Override
              public void onCreate() {

                  super.onCreate();

                  if (Build.VERSION.SDK_INT >= 26) {

                      NotificationChannel channel =
                          new NotificationChannel(
                              CHANNEL,
                              "FRIDAY Voice",
                              NotificationManager.IMPORTANCE_LOW
                          );

                      getSystemService(
                          NotificationManager.class
                      ).createNotificationChannel(channel);
                  }

                  Notification.Builder builder =
                      Build.VERSION.SDK_INT >= 26
                      ? new Notification.Builder(this, CHANNEL)
                      : new Notification.Builder(this);

                  builder
                      .setContentTitle("FRIDAY")
                      .setContentText(
                          "FRIDAY voice service is active"
                      )
                      .setSmallIcon(
                          android.R.drawable.ic_btn_speak_now
                      );

                  startForeground(
                      77,
                      builder.build()
                  );
              }

              @Override
              public int onStartCommand(
                  Intent intent,
                  int flags,
                  int startId) {

                  return START_STICKY;
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

      - name: Create FridayAccessibilityService.java
        shell: bash
        run: |
          cat > app/src/main/java/com/example/friday/FridayAccessibilityService.java <<'EOF'
          package com.example.friday;

          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;

          public class FridayAccessibilityService
              extends AccessibilityService {

              @Override
              public void onAccessibilityEvent(
                  AccessibilityEvent event) {
              }

              @Override
              public void onInterrupt() {
              }

              public boolean pressBack() {
                  return performGlobalAction(
                      GLOBAL_ACTION_BACK
                  );
              }

              public boolean pressHome() {
                  return performGlobalAction(
                      GLOBAL_ACTION_HOME
                  );
              }

              public boolean openRecentApps() {
                  return performGlobalAction(
                      GLOBAL_ACTION_RECENTS
                  );
              }

              public AccessibilityNodeInfo getCurrentRoot() {
                  return getRootInActiveWindow();
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk

      - name: Upload FRIDAY APK
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-V3.1-FIXED-APK
          path: app/build/outputs/apk/debug/app-debug.apk
